<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>優穀日・後台訂單管理系統</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }
    .status-badge-new { background-color: #FEE2E2; color: #DC2626; border: 1px solid #FCA5A5; }
    .status-badge-preparing { background-color: #FEF3C7; color: #D97706; border: 1px solid #FCD34D; }
    .status-badge-ready { background-color: #E0E7FF; color: #4F46E5; border: 1px solid #A5B4FC; }
    .status-badge-completed { background-color: #D1FAE5; color: #059669; border: 1px solid #6EE7B7; }
    .status-badge-cancelled { background-color: #F3F4F6; color: #6B7280; border: 1px solid #E5E7EB; }
  </style>
</head>
<body class="bg-stone-100 min-h-screen text-stone-800 antialiased flex flex-col">

  <!-- 登入驗證彈窗 (未登入時全螢幕覆蓋) -->
  <div id="loginModal" class="fixed inset-0 z-50 bg-stone-900/85 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl border border-stone-200 max-w-sm w-full p-7 text-center">
      <img src="images/logo.png" alt="Logo" class="w-16 h-16 mx-auto rounded-full border-2 border-emerald-600 shadow-md p-1 bg-white mb-3 object-contain">
      <h2 class="text-xl font-bold text-stone-900 mb-1">優穀日・店長後台</h2>
      <p class="text-xs text-stone-500 mb-5">請輸入管理員帳號與密碼以進入系統</p>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-3.5 text-left">
        <div>
          <label class="block text-xs font-bold text-stone-700 mb-1">管理帳號</label>
          <div class="relative">
            <i class="fas fa-user absolute left-3.5 top-3 text-stone-400 text-xs"></i>
            <input type="text" id="loginUsername" required class="w-full pl-9 pr-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-emerald-600" placeholder="預設帳號：admin" autocomplete="username" autofocus>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-stone-700 mb-1">管理密碼</label>
          <div class="relative">
            <i class="fas fa-lock absolute left-3.5 top-3 text-stone-400 text-xs"></i>
            <input type="password" id="loginPassword" required class="w-full pl-9 pr-9 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-emerald-600" placeholder="預設密碼：yougu888" autocomplete="current-password">
            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-2.5 text-stone-400 hover:text-stone-600">
              <i id="pwdToggleIcon" class="fas fa-eye text-xs"></i>
            </button>
          </div>
        </div>

        <div id="loginError" class="hidden bg-rose-50 border border-rose-200 text-rose-600 text-xs rounded-lg p-2 text-center font-medium">
          <i class="fas fa-exclamation-circle mr-1"></i> 帳號或密碼錯誤，請重新輸入
        </div>

        <button type="submit" class="w-full py-2.5 bg-emerald-800 hover:bg-emerald-900 text-white font-bold rounded-xl shadow-md transition duration-150 flex items-center justify-center space-x-1.5 text-xs mt-3">
          <i class="fas fa-sign-in-alt"></i>
          <span>登入系統</span>
        </button>

        <div class="pt-2 text-center text-[11px] text-stone-400 border-t border-stone-100 mt-2">
          預設帳號：<span class="font-mono font-semibold text-stone-600">admin</span><br>
          預設密碼：<span class="font-mono font-semibold text-stone-600">yougu888</span>
        </div>
      </form>
    </div>
  </div>

  <!-- 修改密碼彈窗 -->
  <div id="changePwdModal" class="fixed inset-0 z-50 bg-stone-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 text-left">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-bold text-stone-800 text-sm"><i class="fas fa-key text-emerald-700 mr-1.5"></i>修改店長密碼</h3>
        <button onclick="closeChangePasswordModal()" class="text-stone-400 hover:text-stone-600"><i class="fas fa-times"></i></button>
      </div>
      <form onsubmit="saveNewPassword(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-stone-700 mb-1">目前密碼</label>
          <input type="password" id="currPwdInput" required class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg text-xs focus:ring-2 focus:ring-emerald-600 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-stone-700 mb-1">新密碼</label>
          <input type="password" id="newPwdInput" required minlength="4" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg text-xs focus:ring-2 focus:ring-emerald-600 outline-none" placeholder="至少4位數">
        </div>
        <div id="changePwdError" class="hidden text-rose-600 text-xs font-medium"></div>
        <div class="flex space-x-2 pt-2">
          <button type="button" onclick="closeChangePasswordModal()" class="flex-1 py-2 bg-stone-100 hover:bg-stone-200 text-stone-600 rounded-lg text-xs font-bold">取消</button>
          <button type="submit" class="flex-1 py-2 bg-emerald-800 hover:bg-emerald-900 text-white rounded-lg text-xs font-bold">儲存新密碼</button>

  <!-- Header -->
  <header class="bg-emerald-900 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <img src="images/logo.png" alt="Logo" class="w-10 h-10 object-contain rounded-full bg-white p-0.5 shadow-sm">
        <div>
          <div class="flex items-center space-x-2">
            <h1 class="text-lg font-bold tracking-wide">優穀日・店長後台</h1>
            <span class="text-xs bg-emerald-700 text-emerald-100 px-2 py-0.5 rounded-full">即時接單看板</span>
          </div>
          <p class="text-xs text-emerald-200">100% 無加糖鮮奶優格專賣・當日接單現做</p>
        </div>
      </div>
      
      <!-- Right Controls -->
      <div class="flex items-center space-x-1.5 sm:space-x-2.5">
        <!-- Sound alert toggle -->
        <button id="soundToggleBtn" onclick="toggleSound()" class="flex items-center space-x-1.5 px-2.5 sm:px-3 py-1.5 text-xs font-medium rounded-lg bg-emerald-800 hover:bg-emerald-700 text-emerald-100 transition shadow-sm">
          <i id="soundIcon" class="fas fa-volume-up text-amber-300"></i>
          <span id="soundText" class="hidden md:inline">提示音: 開</span>
        </button>

        <!-- Refresh button -->
        <button onclick="fetchOrders(true)" class="flex items-center space-x-1 px-2.5 sm:px-3 py-1.5 text-xs font-medium rounded-lg bg-emerald-800 hover:bg-emerald-700 text-emerald-100 transition shadow-sm" title="立即重新整理">
          <i id="refreshIcon" class="fas fa-sync-alt"></i>
          <span class="hidden sm:inline">更新</span>
        </button>

        <!-- Change Password button -->
        <button onclick="openChangePasswordModal()" class="flex items-center space-x-1 px-2.5 sm:px-3 py-1.5 text-xs font-medium rounded-lg bg-emerald-800 hover:bg-emerald-700 text-emerald-100 transition shadow-sm" title="修改店長密碼">
          <i class="fas fa-key text-amber-300"></i>
          <span class="hidden sm:inline">改密碼</span>
        </button>

        <!-- Customer site link -->
        <a href="index.html" target="_blank" class="flex items-center space-x-1 px-2.5 sm:px-3 py-1.5 text-xs font-medium rounded-lg bg-amber-500 hover:bg-amber-600 text-white transition shadow-sm">
          <i class="fas fa-external-link-alt"></i>
          <span class="hidden sm:inline">點餐前台</span>
        </a>

        <!-- Logout button -->
        <button onclick="handleLogout()" class="flex items-center space-x-1 px-2.5 sm:px-3 py-1.5 text-xs font-medium rounded-lg bg-rose-700 hover:bg-rose-800 text-white transition shadow-sm" title="登出後台">
          <i class="fas fa-sign-out-alt"></i>
          <span class="hidden sm:inline">登出</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full">
    
    <!-- Top Summary & Stats -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4 mb-6">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-stone-200 flex items-center justify-between">
        <div>
          <p class="text-xs text-stone-500 font-medium">新進待接單</p>
          <p id="statNewCount" class="text-2xl font-bold text-red-600">0</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-red-50 flex items-center justify-center text-red-500 text-lg">
          <i class="fas fa-bell animate-pulse"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl shadow-sm border border-stone-200 flex items-center justify-between">
        <div>
          <p class="text-xs text-stone-500 font-medium">製作中</p>
          <p id="statPrepCount" class="text-2xl font-bold text-amber-600">0</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-amber-50 flex items-center justify-center text-amber-500 text-lg">
          <i class="fas fa-mortar-pestle"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl shadow-sm border border-stone-200 flex items-center justify-between">
        <div>
          <p class="text-xs text-stone-500 font-medium">待顧客取餐</p>
          <p id="statReadyCount" class="text-2xl font-bold text-indigo-600">0</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-500 text-lg">
          <i class="fas fa-shopping-bag"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl shadow-sm border border-stone-200 flex items-center justify-between">
        <div>
          <p class="text-xs text-stone-500 font-medium">今日累計營業額</p>
          <p id="statTodayRevenue" class="text-2xl font-bold text-emerald-800">$0</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-emerald-50 flex items-center justify-center text-emerald-700 text-lg">
          <i class="fas fa-coins"></i>
        </div>
      </div>
    </div>

    <!-- Ingredient Prep Summary (Collapsible) -->
    <div class="bg-white rounded-xl shadow-sm border border-stone-200 mb-6 overflow-hidden">
      <button onclick="togglePrepWidget()" class="w-full px-5 py-3.5 bg-stone-50 hover:bg-stone-100 flex items-center justify-between transition text-left border-b border-stone-200">
        <div class="flex items-center space-x-2">
          <i class="fas fa-list-check text-emerald-700"></i>
          <span class="font-bold text-sm text-stone-800">今日備料清單自動統計（杯數 & 配料匯總）</span>
        </div>
        <div class="flex items-center space-x-2 text-xs text-stone-500">
          <span id="prepSummaryTag">展開查看</span>
          <i id="prepSummaryIcon" class="fas fa-chevron-down transition-transform"></i>
        </div>
      </button>
      <div id="prepSummaryBody" class="hidden p-5 bg-white">
        <div id="prepSummaryContent" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 text-xs">
          <!-- Dynamic prep stats -->
        </div>
      </div>
    </div>

    <!-- Controls & Status Filter Bar -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-stone-200 mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <!-- Tabs -->
      <div class="flex flex-wrap gap-1.5 sm:gap-2">
        <button onclick="setFilter('all')" id="tab-all" class="filter-tab px-3.5 py-1.5 rounded-lg text-xs font-medium bg-emerald-800 text-white shadow-sm transition">
          全部 (<span id="count-all">0</span>)
        </button>
        <button onclick="setFilter('new')" id="tab-new" class="filter-tab px-3.5 py-1.5 rounded-lg text-xs font-medium bg-stone-100 text-stone-600 hover:bg-stone-200 transition">
          新訂單 (<span id="count-new">0</span>)
        </button>
        <button onclick="setFilter('preparing')" id="tab-preparing" class="filter-tab px-3.5 py-1.5 rounded-lg text-xs font-medium bg-stone-100 text-stone-600 hover:bg-stone-200 transition">
          製作中 (<span id="count-preparing">0</span>)
        </button>
        <button onclick="setFilter('ready')" id="tab-ready" class="filter-tab px-3.5 py-1.5 rounded-lg text-xs font-medium bg-stone-100 text-stone-600 hover:bg-stone-200 transition">
          待取餐 (<span id="count-ready">0</span>)
        </button>
        <button onclick="setFilter('completed')" id="tab-completed" class="filter-tab px-3.5 py-1.5 rounded-lg text-xs font-medium bg-stone-100 text-stone-600 hover:bg-stone-200 transition">
          已完成 (<span id="count-completed">0</span>)
        </button>
      </div>

      <!-- Action buttons: Export CSV, Clear mock -->
      <div class="flex items-center space-x-2 self-end md:self-auto">
        <button onclick="exportCSV()" class="px-3 py-1.5 bg-stone-100 hover:bg-stone-200 text-stone-700 rounded-lg text-xs font-medium flex items-center space-x-1.5 transition">
          <i class="fas fa-file-excel text-emerald-700"></i>
          <span>匯出訂單 CSV</span>
        </button>
        <button onclick="clearDemoOrders()" class="px-3 py-1.5 bg-stone-100 hover:bg-rose-50 text-stone-500 hover:text-rose-600 rounded-lg text-xs font-medium transition" title="清空本地測試資料">
          <i class="fas fa-trash-alt"></i>
          <span>清除測試單</span>
        </button>
      </div>
    </div>

    <!-- Order List Container -->
    <div id="ordersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Loading Placeholder -->
      <div class="col-span-full text-center py-16">
        <i class="fas fa-spinner fa-spin text-3xl text-emerald-800 mb-3"></i>
        <p class="text-stone-500 text-sm">正在載入訂單資料...</p>
      </div>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-16 bg-white rounded-2xl border border-stone-200 p-8">
      <div class="w-16 h-16 bg-stone-100 rounded-full flex items-center justify-center mx-auto text-stone-400 text-2xl mb-3">
        <i class="fas fa-inbox"></i>
      </div>
      <h3 class="text-stone-700 font-bold text-base mb-1">目前沒有符合條件的訂單</h3>
      <p class="text-stone-400 text-xs">顧客下單後將自動即時顯示於此看板</p>
    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-stone-200 py-4 text-center text-xs text-stone-400">
    優穀日 Homemade Yogurt Bowl © 2026 ・ 即時接單管理系統
  </footer>

  <script>
    let orders = [];
    let currentFilter = 'all';
    let soundEnabled = true;
    let lastKnownOrderCount = 0;
    let pollInterval = null;

    // Web Audio Sound Chime Generator (No external MP3 dependency)
    function playChime() {
      if (!soundEnabled) return;
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        
        // Note 1: E5 (659Hz)
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(659.25, now);
        gain1.gain.setValueAtTime(0.3, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.5);

        // Note 2: G#5 (830Hz)
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(830.61, now + 0.15);
        gain2.gain.setValueAtTime(0.3, now + 0.15);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.15);
        osc2.stop(now + 0.7);

        // Note 3: B5 (987Hz)
        const osc3 = audioCtx.createOscillator();
        const gain3 = audioCtx.createGain();
        osc3.type = 'sine';
        osc3.frequency.setValueAtTime(987.77, now + 0.3);
        gain3.gain.setValueAtTime(0.35, now + 0.3);
        gain3.gain.exponentialRampToValueAtTime(0.001, now + 1.1);
        osc3.connect(gain3);
        gain3.connect(audioCtx.destination);
        osc3.start(now + 0.3);
        osc3.stop(now + 1.1);
      } catch (e) {
        console.warn('Audio play failed:', e);
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('soundIcon');
      const text = document.getElementById('soundText');
      if (soundEnabled) {
        icon.className = 'fas fa-volume-up text-amber-300';
        text.innerText = '新單提示音: 開啟';
        playChime();
      } else {
        icon.className = 'fas fa-volume-mute text-stone-400';
        text.innerText = '新單提示音: 關閉';
      }
    }

    // Toggle Prep summary widget
    function togglePrepWidget() {
      const body = document.getElementById('prepSummaryBody');
      const icon = document.getElementById('prepSummaryIcon');
      const tag = document.getElementById('prepSummaryTag');
      if (body.classList.contains('hidden')) {
        body.classList.remove('hidden');
        icon.classList.add('rotate-180');
        tag.innerText = '收合清單';
      } else {
        body.classList.add('hidden');
        icon.classList.remove('rotate-180');
        tag.innerText = '展開查看';
      }
    }

    // Filter switching
    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(b => {
        b.className = 'filter-tab px-3.5 py-1.5 rounded-lg text-xs font-medium bg-stone-100 text-stone-600 hover:bg-stone-200 transition';
      });
      const activeBtn = document.getElementById(`tab-${filter}`);
      if (activeBtn) {
        activeBtn.className = 'filter-tab px-3.5 py-1.5 rounded-lg text-xs font-medium bg-emerald-800 text-white shadow-sm transition';
      }
      renderOrders();
    }

    // Fetch orders from API + sync with localStorage backup
    async function fetchOrders(isManual = false) {
      const refreshIcon = document.getElementById('refreshIcon');
      if (refreshIcon && isManual) refreshIcon.classList.add('fa-spin');

      let remoteOrders = [];
      try {
        const res = await fetch('/api/orders');
        if (res.ok) {
          const data = await res.json();
          if (data && data.orders) {
            remoteOrders = data.orders;
          }
        }
      } catch (err) {
        console.warn('API fetch offline or local fallback:', err);
      }

      // Merge with localStorage
      let localOrders = [];
      try {
        const stored = localStorage.getItem('yougu_orders');
        if (stored) localOrders = JSON.parse(stored);
      } catch (e) {}

      // Combine by unique orderId
      const map = new Map();
      localOrders.forEach(o => { const key = o.orderId || o.id; if (key) map.set(key, o); });
      remoteOrders.forEach(o => { const key = o.orderId || o.id; if (key) map.set(key, o); }); // remote updates win

      const combined = Array.from(map.values());
      // Sort newest first
      combined.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

      // Check for new incoming orders
      const currentNewCount = combined.filter(o => o.status === 'new').length;
      if (currentNewCount > lastKnownOrderCount && lastKnownOrderCount !== 0) {
        playChime();
      }
      lastKnownOrderCount = currentNewCount;

      orders = combined;
      updateStats();
      renderOrders();

      if (refreshIcon && isManual) {
        setTimeout(() => refreshIcon.classList.remove('fa-spin'), 500);
      }
    }

    // Update statistics & counts
    function updateStats() {
      const countAll = orders.length;
      const countNew = orders.filter(o => o.status === 'new').length;
      const countPrep = orders.filter(o => o.status === 'preparing').length;
      const countReady = orders.filter(o => o.status === 'ready').length;
      const countCompleted = orders.filter(o => o.status === 'completed').length;

      document.getElementById('count-all').innerText = countAll;
      document.getElementById('count-new').innerText = countNew;
      document.getElementById('count-preparing').innerText = countPrep;
      document.getElementById('count-ready').innerText = countReady;
      document.getElementById('count-completed').innerText = countCompleted;

      document.getElementById('statNewCount').innerText = countNew;
      document.getElementById('statPrepCount').innerText = countPrep;
      document.getElementById('statReadyCount').innerText = countReady;

      // Calculate revenue (excluding cancelled)
      const validOrders = orders.filter(o => o.status !== 'cancelled');
      const todayTotal = validOrders.reduce((sum, o) => sum + (o.finalTotal || o.totalAmount || 0), 0);
      document.getElementById('statTodayRevenue').innerText = `$${todayTotal.toLocaleString()}`;

      // Update Ingredient prep summary
      updatePrepSummary(validOrders);
    }

    // Calculate aggregated ingredients
    function updatePrepSummary(orderList) {
      const itemCounts = {};
      let totalCups = 0;
      let ecoBagCount = 0;

      orderList.forEach(o => {
        if (o.bringEcoBag) ecoBagCount++;
        (o.items || []).forEach(item => {
          totalCups += item.quantity || 1;
          const name = item.name || '優格碗';
          itemCounts[name] = (itemCounts[name] || 0) + (item.quantity || 1);
          
          if (item.addOns && item.addOns.length > 0) {
            item.addOns.forEach(add => {
              const addKey = `【加料】${add.name}`;
              itemCounts[addKey] = (itemCounts[addKey] || 0) + (item.quantity || 1);
            });
          }
        });
      });

      const prepContainer = document.getElementById('prepSummaryContent');
      if (totalCups === 0) {
        prepContainer.innerHTML = '<p class="col-span-full text-stone-400">目前尚無待備料品項。</p>';
        return;
      }

      let html = `
        <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-lg">

              <p class="text-[11px] text-stone-400">手工當日現點現裝</p>

    }

    // Render order cards
    function renderOrders() {
      const container = document.getElementById('ordersContainer');
      const emptyState = document.getElementById('emptyState');

      const filtered = orders.filter(o => {
        if (currentFilter === 'all') return true;
        return o.status === currentFilter;
      });

      if (filtered.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      container.innerHTML = filtered.map(o => {
        const statusMap = {
          'new': { label: '新進待接單', class: 'status-badge-new', icon: 'fa-bell' },
          'preparing': { label: '製作中', class: 'status-badge-preparing', icon: 'fa-fire-burner' },
          'ready': { label: '待顧客取餐', class: 'status-badge-ready', icon: 'fa-bag-shopping' },
          'completed': { label: '已完成', class: 'status-badge-completed', icon: 'fa-check' },
          'cancelled': { label: '已取消', class: 'status-badge-cancelled', icon: 'fa-ban' }
        };

        const statusInfo = statusMap[o.status] || { label: o.status, class: 'status-badge-new', icon: 'fa-circle' };
        const orderTime = o.createdAt ? new Date(o.createdAt).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }) : '';
        const orderDate = o.createdAt ? new Date(o.createdAt).toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit' }) : '';

        return `
          <div class="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden flex flex-col justify-between hover:shadow-md transition">
            <!-- Order Header -->
            <div class="p-4 border-b border-stone-100 bg-stone-50/50">
              <div class="flex items-center justify-between mb-2">
                <span class="font-mono font-bold text-xs bg-stone-200 text-stone-700 px-2 py-0.5 rounded">
                  #${o.orderId || o.id || 'YG-ORDER'}
                </span>

                  <span class="px-2.5 py-0.5 rounded-full text-xs font-bold flex items-center space-x-1 ${statusInfo.class}">

                  </span>

                <div class="flex items-center space-x-2 text-emerald-900 font-bold">
                  <i class="fas fa-clock text-emerald-700 text-sm"></i>
                  <span>預約取餐：${o.pickupDate || '今日'} ${o.pickupTime || '盡速'}</span>
                </div>
                <span class="text-emerald-700 text-[11px] font-normal">下單 ${orderTime}</span>
              </div>
            </div>

            <div class="px-4 py-3 border-b border-stone-100 text-xs text-stone-600 space-y-1.5">

                <div class="flex items-center space-x-2 font-medium text-stone-800">
                  <i class="fas fa-user text-stone-400"></i>
                  <span class="font-bold text-stone-900">${escapeHtml(o.customerName || '顧客')}</span>
                  ${o.bringEcoBag || o.needBag ? '<span class="bg-emerald-100 text-emerald-800 text-[10px] px-1.5 py-0.2 rounded font-medium"><i class="fas fa-leaf mr-0.5"></i>自備環保袋</span>' : ''}
                </div>
                <a href="tel:${o.customerPhone || o.phone}" class="text-emerald-700 hover:text-emerald-900 font-bold flex items-center space-x-1 bg-emerald-50 px-2 py-0.5 rounded">
                  <i class="fas fa-phone-alt"></i>
                  <span>${o.customerPhone || o.phone || '未留電話'}</span>
                </a>
              </div>

              <div class="flex items-center justify-between text-stone-500 pt-0.5">
                <span>付款方式：<b class="text-stone-700">${o.paymentMethod === 'linepay' ? 'LINE Pay Money' : '現場現金支付'}</b></span>
                ${o.couponApplied || o.discountCode ? '<span class="text-rose-600 font-semibold text-[11px]"><i class="fas fa-tag mr-0.5"></i>已用集點券</span>' : ''}
              </div>

              ${o.notes || o.note ? `
                <div class="mt-2 bg-stone-100 p-2 rounded text-stone-700 text-[11px] flex items-start space-x-1.5">

            <!-- Items list -->
            <div class="px-4 py-3 flex-1 text-xs space-y-2">
              <div class="font-medium text-stone-500 text-[11px] mb-1">訂購品項：</div>
              ${(o.items || []).map(item => `
                <div class="flex items-start justify-between pb-1.5 border-b border-dashed border-stone-200 last:border-none">
                  <div>
                    <div class="font-bold text-stone-800 flex items-center space-x-1.5">
                      <span class="text-emerald-800">${item.quantity || item.qty || 1}x</span>
                      <span>${escapeHtml(item.name)}</span>
                    </div>
                    ${(item.addOns && item.addOns.length > 0) || (item.options && item.options.length > 0) ? `
                      <div class="text-[11px] text-amber-700 pl-4 mt-0.5">
                        加料: ${(item.addOns ? item.addOns.map(a => escapeHtml(a.name || a)) : item.options.map(escapeHtml)).join(', ')}
                      </div>
                    ` : ''}
                  </div>
                  <span class="text-stone-600 font-medium">$${item.subtotal || item.price * (item.quantity || item.qty || 1)}</span>
                </div>
              `).join('')}
            </div>

            <!-- Footer: Total & Actions -->
            <div class="p-4 bg-stone-50 border-t border-stone-200">
              <div class="flex items-baseline justify-between mb-3">
                <span class="text-xs text-stone-500">合計應收金額</span>
                <span class="text-lg font-black text-emerald-900">$${o.finalTotal || o.totalAmount || o.total || 0}</span>
              </div>

              <!-- Quick Status Transitions -->
              <div class="grid grid-cols-2 gap-2 text-xs">
                ${o.status === 'new' ? `
                  <button onclick="updateStatus('${o.orderId || o.id}', 'preparing')" class="col-span-2 py-2 bg-emerald-800 hover:bg-emerald-700 text-white font-bold rounded-lg transition shadow-sm flex items-center justify-center space-x-1.5">
                    <i class="fas fa-check-circle"></i>
                    <span>接單並開始製作</span>
                  </button>
                ` : ''}

                ${o.status === 'preparing' ? `
                  <button onclick="updateStatus('${o.orderId || o.id}', 'ready')" class="col-span-2 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg transition shadow-sm flex items-center justify-center space-x-1.5">
                    <i class="fas fa-shopping-bag"></i>
                    <span>製作完成・待取餐</span>
                  </button>
                ` : ''}

                ${o.status === 'ready' ? `
                  <button onclick="updateStatus('${o.orderId || o.id}', 'completed')" class="col-span-2 py-2 bg-stone-800 hover:bg-stone-900 text-white font-bold rounded-lg transition shadow-sm flex items-center justify-center space-x-1.5">
                    <i class="fas fa-check-double"></i>
                    <span>顧客已取餐・結案</span>
                  </button>
                ` : ''}

                ${o.status === 'completed' ? `
                  <div class="col-span-2 py-1.5 text-center text-xs text-emerald-800 font-bold bg-emerald-100 rounded-lg">
                    <i class="fas fa-check mr-1"></i>訂單已完成結案
                  </div>
                ` : ''}

                <!-- Secondary actions -->
                <button onclick="copyOrderText('${o.orderId || o.id}')" class="py-1.5 px-2 bg-white hover:bg-stone-100 border border-stone-300 rounded text-stone-700 font-medium transition text-center flex items-center justify-center space-x-1">
                  <i class="fas fa-copy text-stone-400"></i>
                  <span>複製明細</span>
                </button>

                ${o.status !== 'cancelled' && o.status !== 'completed' ? `
                  <button onclick="updateStatus('${o.orderId || o.id}', 'cancelled')" class="py-1.5 px-2 bg-white hover:bg-rose-50 border border-rose-200 text-rose-600 rounded font-medium transition text-center flex items-center justify-center space-x-1">
                    <i class="fas fa-ban"></i>
                    <span>取消此單</span>
                  </button>
                  <button onclick="deleteOrder('${o.orderId || o.id}')" class="col-span-2 py-1 px-2 bg-white hover:bg-rose-50 border border-rose-200 text-rose-600 rounded text-center text-[11px] flex items-center justify-center space-x-1 transition">
                    <i class="fas fa-trash-alt"></i>
                    <span>刪除此訂單</span>
                  </button>
                ` : `
                  <button onclick="deleteOrder('${o.orderId || o.id}')" class="py-1.5 px-2 bg-white hover:bg-rose-50 border border-rose-200 text-rose-600 rounded text-center flex items-center justify-center space-x-1 transition">
                    <i class="fas fa-trash-alt"></i>
                    <span>刪除紀錄</span>
                  </button>
                `}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Helper to safely escape HTML
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }

    // Update order status (PUT /api/orders & localStorage)
    async function updateStatus(orderId, newStatus) {
      // Update local state first for instant response
      const order = orders.find(o => (o.orderId === orderId || o.id === orderId));
      if (order) {
        order.status = newStatus;
        order.updatedAt = new Date().toISOString();
        localStorage.setItem('yougu_orders', JSON.stringify(orders));
        updateStats();
        renderOrders();
      }

      // Sync to Serverless API & Cloudflare R2
      try {
        await fetch('/api/orders', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderId, status: newStatus })
        });
      } catch (err) {
        console.warn('API status sync note:', err);
      }
    }

    // Delete single order
    async function deleteOrder(orderId) {
      if (!confirm(`確定要刪除訂單 #${orderId} 嗎？此動作將同步從雲端資料庫與本機移除。`)) return;
      orders = orders.filter(o => o.orderId !== orderId && o.id !== orderId);
      localStorage.setItem('yougu_orders', JSON.stringify(orders));
      updateStats();
      renderOrders();

      // Sync delete with Cloudflare R2
      try {
        await fetch(`/api/orders?id=${encodeURIComponent(orderId)}`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: orderId, orderId: orderId })
        });
      } catch (err) {
        console.warn('API delete sync note:', err);
      }
    }

    // Copy order text formatted for sending in LINE
    function copyOrderText(orderId) {
      const order = orders.find(o => (o.orderId === orderId || o.id === orderId));
      if (!order) return;

      let itemsStr = "";
      (order.items || []).forEach((item, idx) => {
        const itemNote = (order.notes || order.note) ? ` (${order.notes || order.note})` : '';
        itemsStr += `${idx + 1}. ${item.name}*${item.quantity || item.qty || 1}${idx === 0 && itemNote ? itemNote : ''}\n`;
      });

      const text = `訂餐格式

請備註😊
1. 訂購人：${order.customerName || ''}
2. 聯絡電話：${order.customerPhone || order.phone || ''}
3. 取餐日期：${order.pickupDate || ''}
4. 取餐時間：${order.pickupTime || ''}
5.餐點品項：
請寫 (數量在品名後面*) (特殊需求請寫在品項後面)
${itemsStr}
付款方式：${order.paymentMethod === 'linepay' ? 'LINE Pay Money' : '現金付款'}
自備環保袋：${order.bringEcoBag || order.needBag ? '是' : '否'}
${order.couponApplied || order.discountCode ? `集點優惠：${order.couponApplied || order.discountCode}\n` : ''}總金額：NT$ ${order.finalTotal || order.totalAmount || order.total || 0}
${order.notes || order.note ? `備註：${order.notes || order.note}\n` : ''}
‼️有回覆才算訂單完成✅`;

      navigator.clipboard.writeText(text).then(() => {
        alert(`已複製符合官方格式的訂單 #${orderId} 明細！可直接貼在 LINE 傳送。`);
      });
    }

    // Export orders as CSV
    function exportCSV() {
      if (orders.length === 0) {
        alert('目前無訂單可匯出');
        return;
      }

      let csv = "\uFEFF單號,下單時間,取餐日期,取餐時間,顧客姓名,電話,品項清單,合計金額,付款方式,狀態,備註\n";
      orders.forEach(o => {
        const items = (o.items || []).map(i => `${i.name}x${i.quantity || i.qty || 1}`).join('; ');
        const row = [
          o.orderId || o.id || '',
          o.createdAt || '',
          o.pickupDate || '',
          o.pickupTime || '',
          `"${(o.customerName || '').replace(/"/g, '""')}"`,
          `'${o.customerPhone || o.phone || ''}`,
          `"${items.replace(/"/g, '""')}"`,
          o.finalTotal || o.totalAmount || o.total || 0,
          o.paymentMethod || 'cash',
          o.status || '',
          `"${(o.notes || o.note || '').replace(/"/g, '""')}"`
        ];
        csv += row.join(',') + "\n";
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `優穀日_訂單清單_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // Clear demo orders
    async function clearDemoOrders() {
      if (!confirm('確定要清空所有訂單資料嗎？這將同時清空 Cloudflare R2 雲端儲存與本機紀錄！')) return;
      orders = [];
      localStorage.removeItem('yougu_orders');
      updateStats();
      renderOrders();

      try {
        await fetch('/api/orders?all=true', {
          method: 'DELETE'
        });
        alert('所有訂單資料已成功清空！');
      } catch (err) {
        console.warn('清空雲端訂單失敗:', err);
      }
    }

    // ==========================================
    // 加密驗證邏輯 (Web Crypto API SHA-256 + Salt)
    // ==========================================
    const AUTH_SALT = "yougu_secret_salt_2026";
    // 預設帳號: admin, 預設密碼: yougu888 的加鹽雜湊值 (完全無明文密碼)
    const DEFAULT_AUTH_HASH = "39851c6b89a7b7786c050106cd2ee2522f143f0d4c4e201dee606f16b0d76f07";

    // 使用 SHA-256 進行單向安全加密雜湊
    async function hashCredentials(username, password) {
      const text = `${(username || '').trim().toLowerCase()}:${password}:${AUTH_SALT}`;
      const msgBuffer = new TextEncoder().encode(text);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function getStoredAuthHash() {
      return localStorage.getItem('yougu_auth_hash') || DEFAULT_AUTH_HASH;
    }

    function checkAuth() {
      const token = sessionStorage.getItem('yougu_session_token');
      const storedHash = getStoredAuthHash();
      const isAuthed = !!token && token === storedHash;
      const modal = document.getElementById('loginModal');

      if (isAuthed) {
        if (modal) modal.classList.add('hidden');
        return true;
      } else {
        if (modal) modal.classList.remove('hidden');
        return false;
      }
    }

    async function handleLogin(event) {
      if (event) event.preventDefault();
      const u = document.getElementById('loginUsername').value.trim();
      const p = document.getElementById('loginPassword').value;
      const errorDiv = document.getElementById('loginError');

      const computedHash = await hashCredentials(u, p);
      const targetHash = getStoredAuthHash();

      if (computedHash === targetHash) {
        sessionStorage.setItem('yougu_session_token', computedHash);
        if (errorDiv) errorDiv.classList.add('hidden');
        document.getElementById('loginModal').classList.add('hidden');
        document.getElementById('loginPassword').value = '';
        fetchOrders(true);
      } else {
        if (errorDiv) {
          errorDiv.classList.remove('hidden');
          errorDiv.innerText = "⚠️ 帳號或密碼錯誤，請重新輸入！";
        }
      }
    }

    function handleLogout() {
      if (confirm('確定要登出店長後台系統嗎？')) {
        sessionStorage.removeItem('yougu_session_token');
        document.getElementById('loginPassword').value = '';
        const errorDiv = document.getElementById('loginError');
        if (errorDiv) errorDiv.classList.add('hidden');
        document.getElementById('loginModal').classList.remove('hidden');
      }
    }

    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('loginPassword');
      const icon = document.getElementById('pwdToggleIcon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        pwdInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    function openChangePasswordModal() {
      document.getElementById('currPwdInput').value = '';
      document.getElementById('newPwdInput').value = '';
      const err = document.getElementById('changePwdError');
      if (err) err.classList.add('hidden');
      document.getElementById('changePwdModal').classList.remove('hidden');
    }

    function closeChangePasswordModal() {
      document.getElementById('changePwdModal').classList.add('hidden');
    }

    async function saveNewPassword(event) {
      event.preventDefault();
      const curr = document.getElementById('currPwdInput').value;
      const newPwd = document.getElementById('newPwdInput').value;
      const err = document.getElementById('changePwdError');

      // 驗證目前密碼
      const currHash = await hashCredentials('admin', curr);
      const targetHash = getStoredAuthHash();

      if (currHash !== targetHash) {
        if (err) {
          err.innerText = "目前密碼輸入不正確！";
          err.classList.remove('hidden');
        }
        return;
      }

      if (!newPwd || newPwd.length < 4) {
        if (err) {
          err.innerText = "新密碼長度至少需 4 個字元！";
          err.classList.remove('hidden');
        }
        return;
      }

      // 加密儲存新雜湊
      const newHash = await hashCredentials('admin', newPwd);
      localStorage.setItem('yougu_auth_hash', newHash);
      sessionStorage.setItem('yougu_session_token', newHash);

      alert("密碼已透過 SHA-256 加密完成更新！");
      closeChangePasswordModal();
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', () => {
      const authed = checkAuth();
      if (authed) {
        fetchOrders();
      }
      // Poll every 8 seconds for new orders (only if authenticated)
      pollInterval = setInterval(() => {
        if (sessionStorage.getItem('yougu_session_token') === getStoredAuthHash()) {
          fetchOrders(false);
        }
      }, 8000);
    });
  </script>
